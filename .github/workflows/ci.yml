name: Continuous Integration

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test:

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:

        os:
          - ubuntu-latest
          - windows-latest

        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:

      - uses: actions/checkout@v4

      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: ${{ matrix.python-version }}

          cache: pip

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -e .

          pip install \
            pytest \
            pytest-cov \
            ruff \
            mypy \
            types-PyYAML

      - name: Ruff

        run: |

          ruff check .

      - name: Mypy

        run: |

          mypy platform_core

      - name: Unit Tests

        run: |

          pytest tests/unit \
            --cov=platform_core \
            --cov-report=xml \
            --cov-report=term

      - name: Upload Coverage

        uses: actions/upload-artifact@v4

        with:

          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}

          path: |
            coverage.xml
            htmlcov
